name: CI
on: [pull_request]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend — install, build & test
        run: |
          cd backend
          npm ci
          npm run build
          npm test

      - name: Frontend — install, build & test
        run: |
          cd frontend
          npm ci
          npm run build
          npm test
